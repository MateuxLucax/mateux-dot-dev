<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="theme-color" content="#eff1f5" />
		<script>
			(() => {
				const root = document.documentElement;
				const themeColor = document.querySelector('meta[name="theme-color"]');
				const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
				const apply = () => {
					let stored;
					try {
						stored = localStorage.getItem('theme');
					} catch {
						stored = null;
					}
					root.dataset.theme =
						stored === 'light' || stored === 'dark'
							? stored
							: systemTheme.matches
								? 'dark'
								: 'light';
					themeColor?.setAttribute(
						'content',
						root.dataset.theme === 'dark' ? '#1e1e2e' : '#eff1f5'
					);
				};
				apply();
				systemTheme.addEventListener('change', () => {
					try {
						if (localStorage.getItem('theme')) return;
					} catch {}
					apply();
				});
			})();
		</script>
		<link rel="preload" href="/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta
			name="description"
			content="Software engineer in Brazil. I take things apart and write down how they work."
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			rel="alternate"
			type="application/atom+xml"
			title="mateux.dev blog"
			href="/blog/rss.xml"
		/>
		<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
