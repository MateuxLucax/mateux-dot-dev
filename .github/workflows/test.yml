name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run svelte-check
        run: bun run check

      - name: Build site
        run: bun run build

  lighthouse:
    runs-on: ubuntu-24.04
    needs: check-and-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start preview
        run: |
          bun run preview --host 127.0.0.1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:4173/ && exit 0
            sleep 1
          done
          exit 1
      - name: Audit every page
        run: LIGHTHOUSE_RUNS=1 node scripts/lighthouse.mjs /tmp/mateux-perf/ci --assert
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: /tmp/mateux-perf/ci/
          retention-days: 7

  e2e:
    runs-on: ubuntu-24.04
    needs: check-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build site for preview
        run: bun run build

      - name: Start vite preview
        run: |
          bun run preview &
          for i in {1..30}; do
            if curl -sf http://localhost:4173/ > /dev/null 2>&1; then
              echo "Preview server is up!"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"
          exit 1

      - name: Run Playwright tests
        run: PLAYWRIGHT_BASE_URL=http://localhost:4173 bunx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
